function loadLS(k,d){try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function swapItems(arr,id,dir){const n=arr.map(x=>({...x}));const i=n.findIndex(x=>x.id===id);const t=i+dir;if(i===-1||t<0||t>=n.length)return arr;[n[i],n[t]]=[n[t],n[i]];return n;}
function buildLessonGroups(){return Array.from({length:50},(_,i)=>({id:2000+i+1,name:"Lesson "+(i+1),color:GROUP_PALETTE[i%GROUP_PALETTE.length]}));}
function assignLessonGroups(vocab,groups){const bl={};groups.forEach(g=>{const m=g.name.match(/^Lesson (\d+)$/);if(m)bl[parseInt(m[1])]=g.id;});const ig={};Object.entries(LESSON_VOCAB_MAP).forEach(([l,ids])=>{const gid=bl[parseInt(l)];if(gid)ids.forEach(id=>{ig[id]=gid;});});return vocab.map(w=>({...w,groups:ig[w.id]?[ig[w.id]]:(w.groups||[])}));}

function getApiKey(){return loadLS("jp_apikey","");}

async function callAPI(prompt,maxTokens){
  const key=getApiKey();
  const headers={"Content-Type":"application/json"};
  if(key)headers["x-api-key"]=key;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers,
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages:[{role:"user",content:prompt}]}),
  });
  const data=await res.json();
  if(data.error)throw new Error(JSON.stringify(data.error));
  return data.content.find(b=>b.type==="text")?.text||"";
}
function extractJSON(t){const s=t.indexOf("["),e=t.lastIndexOf("]");if(s===-1||e===-1)throw new Error("No JSON array");return JSON.parse(t.slice(s,e+1));}
function extractJSONObj(t){return JSON.parse(t.replace(/```json|```/g,"").trim());}

function Badge({label,style}){return <span style={{fontSize:11,fontWeight:500,padding:"2px 8px",borderRadius:20,...style}}>{label}</span>;}
function StarBtn({active,onClick}){return <button onClick={onClick} style={{background:"none",border:"none",cursor:"pointer",padding:"2px 4px",fontSize:18,color:active?"#EF9F27":"#B4B2A9",lineHeight:1}}>{active?"★":"☆"}</button>;}
function MoveBtn({dir,disabled,onClick}){return <button onClick={onClick} disabled={disabled} style={{background:"none",border:"0.5px solid #e8e8e5",borderRadius:4,cursor:disabled?"default":"pointer",color:disabled?"#D3D1C7":"#6b6b6b",fontSize:12,padding:"2px 6px",lineHeight:1}}>{dir==="up"?"▲":"▼"}</button>;}
function GroupPill({name,color,onRemove}){return <span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontWeight:500,padding:"2px 8px",borderRadius:20,background:color+"22",color,border:"0.5px solid "+color+"66"}}>{name}{onRemove&&<span onClick={onRemove} style={{cursor:"pointer",fontSize:13,lineHeight:1,opacity:0.7}}>×</span>}</span>;}
function GroupSelector({itemGroups,allGroups,onToggle}){
  if(!allGroups.length)return <span style={{fontSize:12,color:"#B4B2A9",fontStyle:"italic"}}>No groups yet — create one in Settings</span>;
  return <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{allGroups.map(g=>{const a=(itemGroups||[]).includes(g.id);return <span key={g.id} onClick={()=>onToggle(g.id)} style={{cursor:"pointer",fontSize:12,fontWeight:500,padding:"3px 10px",borderRadius:20,background:a?g.color+"22":"#f5f5f3",color:a?g.color:"#6b6b6b",border:"0.5px solid "+(a?g.color:"#d1d1ce"),userSelect:"none"}}>{g.name}</span>;})}</div>;
}
function highlightText(text,part){
  if(!part||!text||!text.includes(part))return <span>{text}</span>;
  const i=text.indexOf(part);
  return <span>{text.slice(0,i)}<mark style={{background:"#FAEEDA",color:"#633806",borderRadius:3,padding:"0 2px",fontWeight:500}}>{part}</mark>{text.slice(i+part.length)}</span>;
}
function FuriganaLine({furigana,highlightJp}){
  if(!furigana||!Array.isArray(furigana))return null;
  const full=furigana.map(p=>p.kanji).join("");
  const hlS=highlightJp?full.indexOf(highlightJp):-1;
  const hlE=hlS>=0?hlS+highlightJp.length:-1;
  let pos=0;
  return <span style={{display:"inline-flex",flexWrap:"wrap",alignItems:"flex-end",gap:"1px",lineHeight:1.8}}>{furigana.map((p,i)=>{const s=pos,e=pos+p.kanji.length;pos=e;const hl=hlS>=0&&s<hlE&&e>hlS;return <ruby key={i} style={hl?{background:"#FAEEDA",borderRadius:3,padding:"0 2px"}:{}}><span style={{fontSize:15,fontWeight:500,color:hl?"#633806":"#1a1a1a"}}>{p.kanji}</span>{p.reading&&<rt style={{fontSize:10,color:hl?"#633806":"#6b6b6b",textAlign:"center"}}>{p.reading}</rt>}</ruby>;})}</span>;
}

function ConjugationTable({word}){
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const load=async()=>{
    setLoading(true);setResult(null);
    try{const t=await callAPI("Conjugations for Japanese verb \""+word.japanese+"\" ("+word.romaji+", "+word.meaning+"). ONLY a JSON array, no markdown. Each: {\"form\":\"...\",\"japanese\":\"...\",\"romaji\":\"...\",\"meaning\":\"...\"}. Include: dictionary, polite present, negative plain, negative polite, past plain, past polite, te-form, potential, volitional.",1000);setResult(extractJSONObj(t));}
    catch{setResult("error");}
    setLoading(false);
  };
  return <div style={{marginTop:12}}>
    {!result&&!loading&&<button onClick={load} style={{fontSize:13,padding:"5px 14px",borderRadius:6,border:"0.5px solid #d1d1ce",background:"#f5f5f3",cursor:"pointer",color:"#1a1a1a"}}>Show conjugations ↗</button>}
    {loading&&<p style={{fontSize:13,color:"#6b6b6b"}}>Loading…</p>}
    {result==="error"&&<p style={{fontSize:13,color:"#A32D2D"}}>Failed. Try again.</p>}
    {Array.isArray(result)&&<table style={{width:"100%",fontSize:13,borderCollapse:"collapse",marginTop:8}}>
      <thead><tr style={{borderBottom:"0.5px solid #e8e8e5"}}>{["Form","Japanese","Romaji","Meaning"].map(h=><th key={h} style={{textAlign:"left",padding:"4px 8px",fontWeight:500,color:"#6b6b6b",fontSize:12}}>{h}</th>)}</tr></thead>
      <tbody>{result.map((r,i)=><tr key={i} style={{borderBottom:"0.5px solid #e8e8e5"}}><td style={{padding:"5px 8px",color:"#6b6b6b",fontSize:12}}>{r.form}</td><td style={{padding:"5px 8px",fontWeight:500}}>{r.japanese}</td><td style={{padding:"5px 8px",color:"#6b6b6b"}}>{r.romaji}</td><td style={{padding:"5px 8px",color:"#6b6b6b"}}>{r.meaning}</td></tr>)}</tbody>
    </table>}
  </div>;
}

function VocabCard({word,onToggleFav,onDelete,onUpdateGroups,reorderMode,onMoveUp,onMoveDown,isFirst,isLast,settings,vocabGroups}){
  const [expanded,setExpanded]=useState(false);
  const [showGroups,setShowGroups]=useState(false);
  const tc=TYPE_COLORS[word.type]||TYPE_COLORS.other;
  const vc=word.verbGroup?VERB_GROUP_COLORS[word.verbGroup]:null;
  const assigned=(vocabGroups||[]).filter(g=>(word.groups||[]).includes(g.id));
  return <div style={{background:"#fff"}}>
    <div style={{padding:"14px 16px",display:"flex",gap:10,alignItems:"flex-start"}}>
      {reorderMode&&<div style={{display:"flex",flexDirection:"column",gap:4,paddingTop:4,flexShrink:0}}><MoveBtn dir="up" disabled={isFirst} onClick={onMoveUp}/><MoveBtn dir="down" disabled={isLast} onClick={onMoveDown}/></div>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:22,fontWeight:500}}>{word.japanese}</span>
            {settings.vocab_showHiragana&&<span style={{fontSize:14,color:"#6b6b6b"}}>{word.hiragana}</span>}
            {settings.vocab_showType&&<Badge label={word.type} style={{background:tc.bg,color:tc.color,border:"0.5px solid "+tc.border}}/>}
            {word.type==="verb"&&vc&&<Badge label={"Group "+word.verbGroup} style={{background:vc.bg,color:vc.color,border:"0.5px solid "+vc.border}}/>}
            {assigned.map(g=><GroupPill key={g.id} name={g.name} color={g.color}/>)}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <StarBtn active={word.favorite} onClick={()=>onToggleFav(word.id)}/>
            <button onClick={()=>setShowGroups(s=>!s)} style={{fontSize:12,padding:"3px 10px",borderRadius:6,border:"0.5px solid #d1d1ce",background:showGroups?"#f5f5f3":"none",cursor:"pointer",color:"#6b6b6b"}}>⊞</button>
            {word.type==="verb"&&<button onClick={()=>setExpanded(e=>!e)} style={{fontSize:12,padding:"3px 10px",borderRadius:6,border:"0.5px solid #d1d1ce",background:"none",cursor:"pointer",color:"#6b6b6b"}}>{expanded?"hide":"conjugate"}</button>}
            {onDelete&&<button onClick={()=>onDelete(word.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#B4B2A9",fontSize:16,padding:"2px 4px"}}>✕</button>}
          </div>
        </div>
        <div style={{marginTop:6}}>
          <span style={{fontSize:15}}>{word.meaning}</span>
          {settings.vocab_showRomaji&&<span style={{fontSize:13,color:"#6b6b6b",marginLeft:10}}>{word.romaji}</span>}
        </div>
        {showGroups&&<div style={{marginTop:10,padding:"10px 12px",background:"#f5f5f3",borderRadius:8}}>
          <p style={{margin:"0 0 8px",fontSize:12,color:"#6b6b6b",fontWeight:500}}>Assign to groups</p>
          <GroupSelector itemGroups={word.groups||[]} allGroups={vocabGroups||[]} onToggle={gid=>onUpdateGroups(word.id,gid)}/>
        </div>}
      </div>
    </div>
    {expanded&&<div style={{borderTop:"1px solid #D3D1C7",padding:"12px 16px"}}><ConjugationTable word={word}/></div>}
  </div>;
}

function GrammarCard({item,onToggleFav,onDelete,onUpdateNotes,onUpdateGroups,reorderMode,onMoveUp,onMoveDown,isFirst,isLast,settings,grammarGroups,showNotes}){
  const [editingNote,setEditingNote]=useState(false);
  const [noteVal,setNoteVal]=useState(item.notes||"");
  const [examples,setExamples]=useState(null);
  const [loadingEx,setLoadingEx]=useState(false);
  const [exError,setExError]=useState("");
  const [showGroupPicker,setShowGroupPicker]=useState(false);
  const lc=LEVEL_COLORS[item.level]||LEVEL_COLORS.N5;
  const assigned=(grammarGroups||[]).filter(g=>(item.groups||[]).includes(g.id));
  const saveNote=()=>{onUpdateNotes(item.id,noteVal);setEditingNote(false);};
  const loadExamples=async()=>{
    if(examples){setExamples(null);return;}
    setLoadingEx(true);setExError("");
    try{
      const p="Give me 3 simple example sentences using the Japanese grammar pattern \""+item.pattern+"\" ("+item.meaning+"). Return ONLY a raw JSON array, no markdown, no fences. Each: {\"japanese\":\"...\",\"furigana\":[...],\"romaji\":\"...\",\"english\":\"...\",\"highlight_jp\":\"...\",\"highlight_ro\":\"...\"}. furigana: array of {\"kanji\":\"...\",\"reading\":\"...\"}, reading null for kana-only. Keep sentences very short.";
      const t=await callAPI(p,1000);
      setExamples(extractJSON(t));
    }catch(e){setExError(String(e));setExamples("error");}
    setLoadingEx(false);
  };
  return <div style={{background:"#fff"}}>
    <div style={{padding:"14px 16px",display:"flex",gap:10,alignItems:"flex-start"}}>
      {reorderMode&&<div style={{display:"flex",flexDirection:"column",gap:4,paddingTop:4,flexShrink:0}}><MoveBtn dir="up" disabled={isFirst} onClick={onMoveUp}/><MoveBtn dir="down" disabled={isLast} onClick={onMoveDown}/></div>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:20,fontWeight:500}}>{item.pattern}</span>
              {settings.grammar_showRomaji&&<span style={{fontSize:14,color:"#6b6b6b"}}>{item.romaji}</span>}
              {settings.grammar_showLevel&&<Badge label={item.level} style={{background:lc.bg,color:lc.color}}/>}
              {assigned.map(g=><GroupPill key={g.id} name={g.name} color={g.color}/>)}
            </div>
            <p style={{margin:"6px 0 4px",fontSize:15}}>{item.meaning}</p>
            {settings.grammar_showExample&&<p style={{margin:0,fontSize:13,color:"#6b6b6b",fontStyle:"italic"}}>{item.example}</p>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
            <StarBtn active={item.favorite} onClick={()=>onToggleFav(item.id)}/>
            <button onClick={()=>setShowGroupPicker(s=>!s)} style={{fontSize:12,padding:"3px 10px",borderRadius:6,border:"0.5px solid #d1d1ce",background:showGroupPicker?"#f5f5f3":"none",cursor:"pointer",color:"#6b6b6b"}}>⊞</button>
            <button onClick={loadExamples} disabled={loadingEx} style={{fontSize:12,padding:"3px 10px",borderRadius:6,border:"0.5px solid #d1d1ce",background:Array.isArray(examples)?"#f5f5f3":"none",cursor:loadingEx?"default":"pointer",color:"#6b6b6b",whiteSpace:"nowrap"}}>{loadingEx?"Loading…":Array.isArray(examples)?"hide":"examples ↗"}</button>
            {onDelete&&<button onClick={()=>onDelete(item.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#B4B2A9",fontSize:16,padding:"2px 4px"}}>✕</button>}
          </div>
        </div>
        {showGroupPicker&&<div style={{marginTop:10,padding:"10px 12px",background:"#f5f5f3",borderRadius:8}}>
          <p style={{margin:"0 0 8px",fontSize:12,color:"#6b6b6b",fontWeight:500}}>Assign to groups</p>
          <GroupSelector itemGroups={item.groups||[]} allGroups={grammarGroups||[]} onToggle={gid=>onUpdateGroups(item.id,gid)}/>
        </div>}
        {examples==="error"&&<div style={{marginTop:10,borderTop:"1px solid #D3D1C7",paddingTop:10}}>
          <p style={{fontSize:13,color:"#A32D2D",margin:0}}>Failed to load examples.</p>
          {exError&&<p style={{fontSize:11,color:"#A32D2D",margin:"4px 0 0",wordBreak:"break-all"}}>{exError}</p>}
        </div>}
        {Array.isArray(examples)&&<div style={{marginTop:10,borderTop:"1px solid #D3D1C7",paddingTop:10}}>
          <p style={{fontSize:12,fontWeight:500,color:"#6b6b6b",margin:"0 0 10px"}}>Examples</p>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {examples.map((ex,i)=><div key={i} style={{background:"#f5f5f3",borderRadius:8,padding:"10px 12px"}}>
              <div style={{marginBottom:4}}><FuriganaLine furigana={ex.furigana} highlightJp={ex.highlight_jp}/></div>

              <p style={{margin:0,fontSize:13,color:"#6b6b6b",fontStyle:"italic"}}>{ex.english}</p>
            </div>)}
          </div>
        </div>}
        {showNotes&&<div style={{marginTop:10,borderTop:"1px solid #D3D1C7",paddingTop:10}}>
          {!editingNote?<div style={{display:"flex",alignItems:"flex-start",gap:8}}>
            {item.notes?<p style={{margin:0,fontSize:13,color:"#6b6b6b",flex:1,background:"#f5f5f3",borderRadius:6,padding:"6px 10px"}}>📝 {item.notes}</p>:<span style={{fontSize:13,color:"#B4B2A9",fontStyle:"italic",flex:1}}>No notes yet</span>}

            <textarea autoFocus value={noteVal} onChange={e=>setNoteVal(e.target.value)} placeholder="e.g. covered in week 3 of intermediate 1 course" style={{width:"100%",boxSizing:"border-box",padding:"8px 10px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",fontSize:13,color:"#1a1a1a",resize:"vertical",minHeight:60,fontFamily:"inherit"}}/>

            </div>
          </div>}
        </div>}
      </div>
    </div>
  </div>;
}

function StudyTab({vocab,vocabGroups}){
  const [phase,setPhase]=useState("setup");
  const [groupFilter,setGroupFilter]=useState("all");
  const [sourceFilter,setSourceFilter]=useState("all");
  const [direction,setDirection]=useState("jp-en");
  const [deck,setDeck]=useState([]);
  const [index,setIndex]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [got,setGot]=useState([]);
  const [retry,setRetry]=useState([]);
  const [isRetryRound,setIsRetryRound]=useState(false);
  const sel={padding:"8px 10px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",fontSize:14,color:"#1a1a1a",width:"100%"};
  const lbl={fontSize:13,color:"#6b6b6b",marginBottom:6,display:"block"};
  const buildDeck=()=>{
    let pool=[...vocab];
    if(sourceFilter==="favorites")pool=pool.filter(w=>w.favorite);
    if(groupFilter!=="all")pool=pool.filter(w=>(w.groups||[]).includes(Number(groupFilter)));
    const s=pool.sort(()=>Math.random()-0.5);
    setDeck(s);setIndex(0);setFlipped(false);setGot([]);setRetry([]);setIsRetryRound(false);
    setPhase(s.length===0?"empty":"study");
  };
  const advance=(ng,nr,cd,ci)=>{
    if(ci+1<cd.length){setIndex(ci+1);setFlipped(false);}
    else if(nr.length>0){const nd=[...nr].sort(()=>Math.random()-0.5);setDeck(nd);setRetry([]);setIndex(0);setFlipped(false);setIsRetryRound(true);}
    else{setGot(ng);setPhase("results");}
  };
  const handleGot=()=>{const ng=[...got,deck[index]];setGot(ng);advance(ng,retry,deck,index);};
  const handleRetry=()=>{const nr=[...retry,deck[index]];setRetry(nr);advance(got,nr,deck,index);};
  if(phase==="setup")return <div>
    <p style={{fontSize:15,color:"#6b6b6b",marginTop:0,marginBottom:24}}>Configure your flashcard session.</p>
    <div style={{display:"flex",flexDirection:"column",gap:16,maxWidth:400}}>
      <div><label style={lbl}>Card set</label><select style={sel} value={sourceFilter} onChange={e=>setSourceFilter(e.target.value)}><option value="all">All vocabulary</option><option value="favorites">Favorites only</option></select></div>
      <div><label style={lbl}>Group</label><select style={sel} value={groupFilter} onChange={e=>setGroupFilter(e.target.value)}><option value="all">All groups</option>{vocabGroups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select></div>
      <div><label style={lbl}>Direction</label><select style={sel} value={direction} onChange={e=>setDirection(e.target.value)}><option value="jp-en">Japanese → English</option><option value="en-jp">English → Japanese</option></select></div>
      <button onClick={buildDeck} style={{padding:"12px",borderRadius:10,border:"none",background:"#1D9E75",cursor:"pointer",fontWeight:600,fontSize:15,color:"#fff",marginTop:8}}>Start studying →</button>
    </div>
  </div>;
  if(phase==="empty")return <div style={{textAlign:"center",paddingTop:40}}><p style={{fontSize:15,color:"#6b6b6b"}}>No vocabulary found for this selection.</p><button onClick={()=>setPhase("setup")} style={{marginTop:12,padding:"8px 20px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"none",cursor:"pointer",fontSize:14}}>Back to settings</button></div>;
  if(phase==="results")return <div style={{textAlign:"center",paddingTop:20}}>
    <div style={{fontSize:48,marginBottom:12}}>🎉</div>
    <h2 style={{fontSize:22,fontWeight:600,margin:"0 0 8px"}}>Session complete!</h2>
    <p style={{fontSize:15,color:"#6b6b6b",margin:"0 0 28px"}}>You got through all <strong>{got.length}</strong> cards!</p>
    <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
      <button onClick={buildDeck} style={{padding:"10px 22px",borderRadius:8,border:"none",background:"#1D9E75",cursor:"pointer",fontWeight:600,fontSize:14,color:"#fff"}}>Study again</button>
      <button onClick={()=>setPhase("setup")} style={{padding:"10px 22px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"none",cursor:"pointer",fontSize:14}}>Change settings</button>
    </div>
  </div>;
  const card=deck[index];
  const tc=card?(TYPE_COLORS[card.type]||TYPE_COLORS.other):null;
  const vc=card&&card.verbGroup?VERB_GROUP_COLORS[card.verbGroup]:null;
  const progress=deck.length>0?(index/deck.length)*100:0;
  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <button onClick={()=>setPhase("setup")} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#6b6b6b",padding:0}}>← Back</button>
      <span style={{fontSize:13,color:"#6b6b6b"}}>{isRetryRound&&<span style={{color:"#D85A30",fontWeight:500,marginRight:6}}>Retry round</span>}{index+1} / {deck.length}</span>
      <span style={{fontSize:13,color:"#1D9E75",fontWeight:500}}>✓ {got.length}</span>
    </div>
    <div style={{height:4,background:"#f5f5f3",borderRadius:2,marginBottom:24,overflow:"hidden"}}><div style={{height:"100%",width:progress+"%",background:"#1D9E75",borderRadius:2,transition:"width 0.3s"}}/></div>
    <div onClick={()=>setFlipped(f=>!f)} style={{cursor:"pointer",background:"#fff",border:"0.5px solid #e8e8e5",borderRadius:16,minHeight:220,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px",marginBottom:20,textAlign:"center",userSelect:"none"}}>
      {!flipped?<div>
        {direction==="jp-en"?<div><p style={{fontSize:42,fontWeight:600,margin:"0 0 8px"}}>{card.japanese}</p><p style={{fontSize:16,color:"#6b6b6b",margin:0}}>{card.hiragana}</p></div>:<p style={{fontSize:26,fontWeight:500,margin:0}}>{card.meaning}</p>}
        <p style={{fontSize:12,color:"#B4B2A9",marginTop:24,marginBottom:0}}>Tap to reveal</p>
      </div>:<div style={{width:"100%"}}>

function FixVerbGroupsBtn({vocab,onUpdate}){
  const [status,setStatus]=useState("");
  const [loading,setLoading]=useState(false);
  const fix=async()=>{
    setLoading(true);setStatus("");
    const verbs=vocab.filter(w=>w.type==="verb"&&!w.verbGroup);
    if(!verbs.length){setStatus("All verbs already have a group!");setLoading(false);return;}
    try{const p="For each verb, return ONLY a JSON array of {\"japanese\":\"...\",\"verbGroup\":1|2|3}. 1=Godan,2=Ichidan,3=Irregular. Verbs: "+verbs.map(v=>v.japanese).join(", ")+". No markdown.";const t=await callAPI(p,500);const r=extractJSON(t);const m={};r.forEach(x=>{m[x.japanese]=x.verbGroup;});onUpdate(vocab.map(w=>w.type==="verb"?{...w,verbGroup:m[w.japanese]??w.verbGroup??null}:w));setStatus("Updated "+r.length+" verb(s)!");}
    catch(e){setStatus("Failed: "+String(e));}
    setLoading(false);
  };
  return <div><button onClick={fix} disabled={loading} style={{padding:"8px 16px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",cursor:loading?"default":"pointer",fontSize:13,fontWeight:500}}>{loading?"Detecting…":"Detect verb groups"}</button>{status&&<p style={{marginTop:8,fontSize:13,color:status.startsWith("Failed")?"#A32D2D":"#3B6D11"}}>{status}</p>}</div>;

function App(){
  const [tab,setTab]=useState("vocab");

  const [vocabGroups,setVocabGroups]=useState(()=>loadLS("jp_vocabGroups",[]));
  const [grammarGroups,setGrammarGroups]=useState(()=>loadLS("jp_grammarGroups",[]));

  const [filterType,setFilterType]=useState("all");
  const [filterGroup,setFilterGroup]=useState("all");
  const [reorderMode,setReorderMode]=useState(false);
  const [showNotes,setShowNotes]=useState(false);

  const sav=(k,v)=>{setVocab(v);saveLS(k,v);};
  const sag=(k,g)=>{setGrammar(g);saveLS(k,g);};
  const savV=v=>{setVocab(v);saveLS("jp_vocab3",v);};
  const savG=g=>{setGrammar(g);saveLS("jp_grammar3",g);};
  const savVG=vg=>{setVocabGroups(vg);saveLS("jp_vocabGroups",vg);};
  const savGG=gg=>{setGrammarGroups(gg);saveLS("jp_grammarGroups",gg);};
  const updSetting=(k,v)=>{const n={...settings,[k]:v};setSettings(n);saveLS("jp_settings",n);};

  const addVG=g=>savVG([...vocabGroups,g]);
  const delVG=id=>{savVG(vocabGroups.filter(g=>g.id!==id));savV(vocab.map(w=>({...w,groups:(w.groups||[]).filter(gid=>gid!==id)})));};
  const addGG=g=>savGG([...grammarGroups,g]);
  const delGG=id=>{savGG(grammarGroups.filter(g=>g.id!==id));savG(grammar.map(g=>({...g,groups:(g.groups||[]).filter(gid=>gid!==id)})));};

  const togVF=id=>savV(vocab.map(w=>w.id===id?{...w,favorite:!w.favorite}:w));
  const togGF=id=>savG(grammar.map(g=>g.id===id?{...g,favorite:!g.favorite}:g));
  const delV=id=>savV(vocab.filter(w=>w.id!==id));
  const delG=id=>savG(grammar.filter(g=>g.id!==id));
  const addV=w=>savV([...vocab,w]);
  const addG=g=>savG([...grammar,g]);
  const updN=(id,notes)=>savG(grammar.map(g=>g.id===id?{...g,notes}:g));
  const updVG=(id,gid)=>savV(vocab.map(w=>w.id===id?{...w,groups:(w.groups||[]).includes(gid)?w.groups.filter(x=>x!==gid):[...(w.groups||[]),gid]}:w));
  const updGG=(id,gid)=>savG(grammar.map(g=>g.id===id?{...g,groups:(g.groups||[]).includes(gid)?g.groups.filter(x=>x!==gid):[...(g.groups||[]),gid]}:g));
  const mvV=(id,dir)=>savV(swapItems(vocab,id,dir));
  const mvG=(id,dir)=>savG(swapItems(grammar,id,dir));

  const handleReset=()=>{
    const lg=buildLessonGroups();const nv=assignLessonGroups(MNN_VOCAB,lg);

  };

  const dv=reorderMode?vocab:vocab.filter(w=>(!q||w.japanese.includes(q)||w.romaji.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q)||w.hiragana.includes(q))&&(filterType==="all"||w.type===filterType)&&(filterGroup==="all"||(w.groups||[]).includes(Number(filterGroup))));
  const dg=reorderMode?grammar:grammar.filter(g=>(!q||g.pattern.includes(q)||g.romaji.toLowerCase().includes(q)||g.meaning.toLowerCase().includes(q))&&(filterGroup==="all"||(g.groups||[]).includes(Number(filterGroup))));

  const TABS=["vocab","grammar","study","favorites","add","settings"];
  const LABELS={vocab:"Vocabulary",grammar:"Grammar",study:"📚 Study",favorites:"★ Favorites",add:"+ Add",settings:"Settings"};

  const btnStyle=(t)=>({padding:"7px 14px",borderRadius:8,border:"0.5px solid "+(tab===t?"#1a1a1a":"#e8e8e5"),background:tab===t?"#f5f5f3":"none",cursor:"pointer",fontWeight:tab===t?500:400,color:"#1a1a1a",fontSize:13});

  return <div>
    <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:20}}>
      <span style={{fontSize:22,fontWeight:500}}>日本語</span>
      <span style={{fontSize:15,color:"#6b6b6b"}}>Japanese Study App</span>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap"}}>
      {TABS.map(t=><button key={t} onClick={()=>{setTab(t);setReorderMode(false);setFilterGroup("all");}} style={btnStyle(t)}>{LABELS[t]}</button>)}
    </div>

    {(tab==="vocab"||tab==="grammar")&&<div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
      {!reorderMode&&<><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" style={{flex:1,minWidth:120,padding:"8px 12px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",fontSize:14,color:"#1a1a1a"}}/>
      {tab==="vocab"&&<select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",fontSize:13}}><option value="all">All types</option>{["verb","noun","adjective","adverb","other"].map(t=><option key={t} value={t}>{t}</option>)}</select>}
      {ag.length>0&&<select value={filterGroup} onChange={e=>setFilterGroup(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"0.5px solid #d1d1ce",background:"#f5f5f3",fontSize:13}}><option value="all">All groups</option>{ag.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}</select>}</>}
      <button onClick={()=>{setReorderMode(r=>!r);setSearch("");setFilterGroup("all");}} style={{padding:"8px 14px",borderRadius:8,border:"0.5px solid "+(reorderMode?"#1a1a1a":"#d1d1ce"),background:reorderMode?"#f5f5f3":"none",cursor:"pointer",fontSize:13,fontWeight:reorderMode?500:400,whiteSpace:"nowrap"}}>{reorderMode?"✓ Done":"⇅ Reorder"}</button>
    </div>}

    {reorderMode&&<p style={{fontSize:13,color:"#6b6b6b",marginBottom:14,marginTop:-4}}>Use ▲ ▼ to reorder. Click "Done" when finished.</p>}

    {tab==="vocab"&&<div>{dv.length===0&&<p style={{color:"#6b6b6b",fontSize:14}}>No words found.</p>}{dv.map((w,i)=><div key={w.id}>{i>0&&<hr style={{border:"none",borderTop:"1px solid #D3D1C7",margin:0}}/>}<VocabCard word={w} onToggleFav={togVF} onDelete={delV} onUpdateGroups={updVG} settings={settings} vocabGroups={vocabGroups} reorderMode={reorderMode} onMoveUp={()=>mvV(w.id,-1)} onMoveDown={()=>mvV(w.id,1)} isFirst={i===0} isLast={i===dv.length-1}/></div>)}</div>}

    {tab==="grammar"&&<div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
        <button onClick={()=>setShowNotes(s=>!s)} style={{fontSize:13,padding:"5px 14px",borderRadius:8,border:"0.5px solid #d1d1ce",background:showNotes?"#f5f5f3":"none",cursor:"pointer",color:"#6b6b6b"}}>{showNotes?"📝 Hide notes":"📝 Show notes"}</button>
      </div>
      {dg.length===0&&<p style={{color:"#6b6b6b",fontSize:14}}>No grammar patterns found.</p>}
      {dg.map((g,i)=><div key={g.id}>{i>0&&<hr style={{border:"none",borderTop:"1px solid #D3D1C7",margin:0}}/>}<GrammarCard item={g} onToggleFav={togGF} onDelete={delG} onUpdateNotes={updN} onUpdateGroups={updGG} settings={settings} grammarGroups={grammarGroups} reorderMode={reorderMode} onMoveUp={()=>mvG(g.id,-1)} onMoveDown={()=>mvG(g.id,1)} isFirst={i===0} isLast={i===dg.length-1} showNotes={showNotes}/></div>)}
    </div>}

    {tab==="study"&&<StudyTab vocab={vocab} vocabGroups={vocabGroups}/>}

    {tab==="favorites"&&<div>
      {vocab.filter(w=>w.favorite).length===0&&grammar.filter(g=>g.favorite).length===0&&<p style={{color:"#6b6b6b",fontSize:14}}>No favorites yet.</p>}
      {vocab.filter(w=>w.favorite).length>0&&<><p style={{fontSize:13,fontWeight:500,color:"#6b6b6b",marginBottom:10,marginTop:0}}>Vocabulary</p>{vocab.filter(w=>w.favorite).map((w,i)=><div key={w.id}>{i>0&&<hr style={{border:"none",borderTop:"1px solid #D3D1C7",margin:0}}/>}<VocabCard word={w} onToggleFav={togVF} onDelete={delV} onUpdateGroups={updVG} settings={settings} vocabGroups={vocabGroups}/></div>)}</>}
      {grammar.filter(g=>g.favorite).length>0&&<><p style={{fontSize:13,fontWeight:500,color:"#6b6b6b",marginBottom:10,marginTop:vocab.filter(w=>w.favorite).length>0?20:0}}>Grammar</p>{grammar.filter(g=>g.favorite).map((g,i)=><div key={g.id}>{i>0&&<hr style={{border:"none",borderTop:"1px solid #D3D1C7",margin:0}}/>}<GrammarCard item={g} onToggleFav={togGF} onDelete={delG} onUpdateNotes={updN} onUpdateGroups={updGG} settings={settings} grammarGroups={grammarGroups} showNotes={showNotes}/></div>)}</>}
    </div>}

    {tab==="add"&&<AddForm onAddVocab={addV} onAddGrammar={addG} vocabGroups={vocabGroups} grammarGroups={grammarGroups}/>}

    {tab==="settings"&&<SettingsTab settings={settings} onChangeSetting={updSetting} vocabGroups={vocabGroups} grammarGroups={grammarGroups} onAddVocabGroup={addVG} onDeleteVocabGroup={delVG} onAddGrammarGroup={addGG} onDeleteGrammarGroup={delGG} vocab={vocab} onUpdateVocab={savV} onUpdateVocabGroups={savVG} onReset={handleReset}/>}
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
