<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>日本語 Japanese Study App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
    }
    #root {
      max-width: 740px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }
    ruby { ruby-align: center; }
    rt { font-size: 10px; }
    mark { background: #FAEEDA; color: #633806; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
'use strict';
const { useState, useRef, useEffect } = React;

// ── Constants ────────────────────────────────────────────────────────────────

const GROUP_PALETTE = ["#378ADD","#1D9E75","#D85A30","#D4537E","#7F77DD","#BA7517","#639922","#E24B4A"];

const LESSON_VOCAB_MAP = {
  1:[101,102,103,104,105,106,107,108,109,110],
};

const MNN_VOCAB = [
  {id:101,japanese:"わたし",hiragana:"わたし",romaji:"watashi",meaning:"I / me",type:"other",verbGroup:null,favorite:false,groups:[]},
  {id:102,japanese:"あなた",hiragana:"あなた",romaji:"anata",meaning:"you",type:"other",verbGroup:null,favorite:false,groups:[]},
  {id:103,japanese:"かれ",hiragana:"かれ",romaji:"kare",meaning:"he",type:"other",verbGroup:null,favorite:false,groups:[]},
  {id:104,japanese:"かのじょ",hiragana:"かのじょ",romaji:"kanojo",meaning:"she",type:"other",verbGroup:null,favorite:false,groups:[]},
  {id:105,japanese:"がくせい",hiragana:"がくせい",romaji:"gakusei",meaning:"student",type:"noun",verbGroup:null,favorite:false,groups:[]},
  {id:106,japanese:"せんせい",hiragana:"せんせい",romaji:"sensei",meaning:"teacher",type:"noun",verbGroup:null,favorite:false,groups:[]},
  {id:107,japanese:"かいしゃいん",hiragana:"かいしゃいん",romaji:"kaishain",meaning:"company employee",type:"noun",verbGroup:null,favorite:false,groups:[]},
  {id:108,japanese:"いしゃ",hiragana:"いしゃ",romaji:"isha",meaning:"doctor",type:"noun",verbGroup:null,favorite:false,groups:[]},
  {id:109,japanese:"けんきゅうしゃ",hiragana:"けんきゅうしゃ",romaji:"kenkyuusha",meaning:"researcher",type:"noun",verbGroup:null,favorite:false,groups:[]},
  {id:110,japanese:"にほん",hiragana:"にほん",romaji:"nihon",meaning:"Japan",type:"noun",verbGroup:null,favorite:false,groups:[]},
];

const DEFAULT_GRAMMAR = [
  {id:1,pattern:"〜ています",romaji:"~te imasu",meaning:"Ongoing action / current state",example:"食べています — I am eating",level:"N5",favorite:false,notes:"",groups:[],examples:null},
  {id:2,pattern:"〜たい",romaji:"~tai",meaning:"Want to do something",example:"食べたい — I want to eat",level:"N5",favorite:false,notes:"",groups:[],examples:null},
  {id:3,pattern:"〜から",romaji:"~kara",meaning:"Because / since",example:"雨だから — Because it's raining",level:"N5",favorite:false,notes:"",groups:[],examples:null},
  {id:4,pattern:"〜ても",romaji:"~temo",meaning:"Even if / even though",example:"食べても — Even if I eat",level:"N4",favorite:false,notes:"",groups:[],examples:null},
  {id:5,pattern:"〜ながら",romaji:"~nagara",meaning:"While doing two simultaneous actions",example:"音楽を聴きながら — While listening to music",level:"N4",favorite:false,notes:"",groups:[],examples:null},
  {id:6,pattern:"〜はずだ",romaji:"~hazu da",meaning:"Should be / expected to be",example:"来るはずだ — He should come",level:"N3",favorite:false,notes:"",groups:[],examples:null},
];

const DEFAULT_SETTINGS = {
  vocab_showHiragana:true, vocab_showRomaji:true, vocab_showType:true,
  grammar_showRomaji:true, grammar_showExample:true, grammar_showLevel:true,
};

const TYPE_COLORS = {
  verb:      {bg:"#E6F1FB",color:"#0C447C",border:"#85B7EB"},
  noun:      {bg:"#EAF3DE",color:"#27500A",border:"#97C459"},
  adjective: {bg:"#FAEEDA",color:"#633806",border:"#EF9F27"},
  adverb:    {bg:"#FBEAF0",color:"#72243E",border:"#ED93B1"},
  other:     {bg:"#F1EFE8",color:"#444441",border:"#B4B2A9"},
};
const VERB_GROUP_COLORS = {
  1:{bg:"#EDE8FB",color:"#4A2D9C",border:"#9B82E8"},
  2:{bg:"#E8F5FB",color:"#0C5C7C",border:"#5BB3D8"},
  3:{bg:"#FBE8F0",color:"#7C0C3A",border:"#E882AD"},
};
const LEVEL_COLORS = {
  N5:{bg:"#EAF3DE",color:"#27500A"}, N4:{bg:"#E6F1FB",color:"#0C447C"},
  N3:{bg:"#FAEEDA",color:"#633806"}, N2:{bg:"#FAECE7",color:"#712B13"},
  N1:{bg:"#FCEBEB",color:"#791F1F"},
};

// Shared CSS vars as JS constants
const C = {
  bgPrimary: "#ffffff",
  bgSecondary: "#f5f5f3",
  bgTertiary: "#eeede9",
  textPrimary: "#1a1a18",
  textSecondary: "#6b6b67",
  textTertiary: "#9e9e9a",
  borderTertiary: "rgba(0,0,0,0.12)",
  borderSecondary: "rgba(0,0,0,0.22)",
  borderPrimary: "rgba(0,0,0,0.32)",
  green: "#1D9E75",
  red: "#E24B4A",
};

// ── Helpers ──────────────────────────────────────────────────────────────────

function loadLS(k, d) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch { return d; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function swapItems(arr, id, dir) {
  const n = arr.map(x => ({...x}));
  const i = n.findIndex(x => x.id === id), t = i + dir;
  if (i === -1 || t < 0 || t >= n.length) return arr;
  [n[i], n[t]] = [n[t], n[i]];
  return n;
}
function buildLessonGroups() {
  return Array.from({length:50}, (_, i) => ({id:2000+i+1, name:"Lesson "+(i+1), color:GROUP_PALETTE[i%GROUP_PALETTE.length]}));
}
function assignLessonGroups(vocab, groups) {
  const bl = {};
  groups.forEach(g => { const m = g.name.match(/^Lesson (\d+)$/); if (m) bl[+m[1]] = g.id; });
  const ig = {};
  Object.entries(LESSON_VOCAB_MAP).forEach(([l, ids]) => { const gid = bl[+l]; if (gid) ids.forEach(id => { ig[id] = gid; }); });
  return vocab.map(w => ({...w, groups: ig[w.id] ? [ig[w.id]] : (w.groups || [])}));
}
async function callAPI(prompt, maxTokens) {
  const key = loadLS("jp_apikey", "");
  if (!key) throw new Error("No API key set. Add your Anthropic API key in Settings.");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers: {
      "Content-Type":"application/json",
      "x-api-key": key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:maxTokens, messages:[{role:"user", content:prompt}]}),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.content.find(b => b.type === "text")?.text || "";
}
function extractJSON(t) { const s = t.indexOf("["), e = t.lastIndexOf("]"); if (s === -1 || e === -1) throw new Error("No JSON"); return JSON.parse(t.slice(s, e+1)); }
function extractJSONObj(t) { return JSON.parse(t.replace(/```json|```/g, "").trim()); }

// ── Shared UI ─────────────────────────────────────────────────────────────────

function Badge({label, style}) {
  return React.createElement("span", {style:{fontSize:11, fontWeight:500, padding:"2px 8px", borderRadius:20, ...style}}, label);
}
function StarBtn({active, onClick}) {
  return React.createElement("button", {onClick, style:{background:"none", border:"none", cursor:"pointer", padding:"2px 4px", fontSize:18, color:active?"#EF9F27":"#B4B2A9", lineHeight:1}}, active ? "★" : "☆");
}
function MoveBtn({dir, disabled, onClick}) {
  return React.createElement("button", {onClick, disabled, style:{background:"none", border:"0.5px solid "+C.borderTertiary, borderRadius:4, cursor:disabled?"default":"pointer", color:disabled?"#D3D1C7":C.textSecondary, fontSize:12, padding:"2px 6px", lineHeight:1}}, dir==="up"?"▲":"▼");
}
function GroupPill({name, color, onRemove}) {
  return React.createElement("span", {style:{display:"inline-flex", alignItems:"center", gap:4, fontSize:11, fontWeight:500, padding:"2px 8px", borderRadius:20, background:color+"22", color, border:"0.5px solid "+color+"66"}},
    name,
    onRemove && React.createElement("span", {onClick:onRemove, style:{cursor:"pointer", fontSize:13, lineHeight:1, opacity:0.7}}, "×")
  );
}
function GroupSelector({itemGroups, allGroups, onToggle}) {
  if (!allGroups.length) return React.createElement("span", {style:{fontSize:12, color:"#B4B2A9", fontStyle:"italic"}}, "No groups yet");
  return React.createElement("div", {style:{display:"flex", flexWrap:"wrap", gap:6}},
    allGroups.map(g => {
      const a = (itemGroups||[]).includes(g.id);
      return React.createElement("span", {key:g.id, onClick:()=>onToggle(g.id), style:{cursor:"pointer", fontSize:12, fontWeight:500, padding:"3px 10px", borderRadius:20, background:a?g.color+"22":C.bgSecondary, color:a?g.color:C.textSecondary, border:"0.5px solid "+(a?g.color:C.borderSecondary), userSelect:"none"}}, g.name);
    })
  );
}
function highlightText(text, part) {
  if (!part || !text || !text.includes(part)) return React.createElement("span", null, text);
  const i = text.indexOf(part);
  return React.createElement("span", null,
    text.slice(0,i),
    React.createElement("mark", null, part),
    text.slice(i+part.length)
  );
}
function FuriganaLine({furigana, highlightJp}) {
  if (!furigana || !Array.isArray(furigana)) return null;
  const full = furigana.map(p => p.kanji).join("");
  const hlS = highlightJp ? full.indexOf(highlightJp) : -1;
  const hlE = hlS >= 0 ? hlS + highlightJp.length : -1;
  let pos = 0;
  return React.createElement("span", {style:{display:"inline-flex", flexWrap:"wrap", alignItems:"flex-end", gap:"1px", lineHeight:1.8}},
    furigana.map((p, i) => {
      const s = pos, e2 = pos + p.kanji.length; pos = e2;
      const hl = hlS >= 0 && s < hlE && e2 > hlS;
      return React.createElement("ruby", {key:i, style:hl?{background:"#FAEEDA", borderRadius:3, padding:"0 2px"}:{}},
        React.createElement("span", {style:{fontSize:15, fontWeight:500, color:hl?"#633806":C.textPrimary}}, p.kanji),
        p.reading && React.createElement("rt", {style:{fontSize:10, color:hl?"#633806":C.textSecondary, textAlign:"center"}}, p.reading)
      );
    })
  );
}

function e(tag, props, ...children) { return React.createElement(tag, props, ...children); }

function SimpleTable({headers, rows, cols}) {
  const hdr = {padding:"8px 10px", fontSize:12, fontWeight:500, color:C.textSecondary, borderBottom:"1px solid #D3D1C7", textAlign:"left", background:C.bgSecondary};
  const cell = {padding:"8px 10px", fontSize:14, borderBottom:"1px solid #D3D1C7"};
  return e("div", {style:{overflowX:"auto"}},
    e("table", {style:{width:"100%", borderCollapse:"collapse", fontSize:14}},
      e("thead", null, e("tr", null, headers.map(h => e("th", {key:h, style:hdr}, h)))),
      e("tbody", null, rows.map((r, i) =>
        e("tr", {key:i, style:{background:i%2===0?C.bgPrimary:C.bgSecondary}},
          cols.map((c, ci) => e("td", {key:ci, style:{...cell, fontWeight:ci===0?500:400, color:ci===0?C.textPrimary:C.textSecondary}}, r[c]))
        )
      ))
    )
  );
}

// ── ConjugationTable ──────────────────────────────────────────────────────────

function ConjugationTable({word}) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const load = async () => {
    setLoading(true); setResult(null);
    try {
      const t = await callAPI("Conjugations for Japanese verb "+word.japanese+" "+word.romaji+" "+word.meaning+". ONLY a JSON array, no markdown. Each item has keys form japanese romaji meaning. Include: dictionary, polite present, negative plain, negative polite, past plain, past polite, te-form, potential, volitional.", 1000);
      setResult(extractJSONObj(t));
    } catch(err) { setResult("error:"+err.message); }
    setLoading(false);
  };
  return e("div", {style:{marginTop:12}},
    !result && !loading && e("button", {onClick:load, style:{fontSize:13, padding:"5px 14px", borderRadius:6, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, cursor:"pointer", color:C.textPrimary}}, "Show conjugations ↗"),
    loading && e("p", {style:{fontSize:13, color:C.textSecondary}}, "Loading…"),
    typeof result === "string" && result.startsWith("error") && e("p", {style:{fontSize:13, color:"#A32D2D"}}, "Failed. Check your API key in Settings."),
    Array.isArray(result) && e("table", {style:{width:"100%", fontSize:13, borderCollapse:"collapse", marginTop:8}},
      e("thead", null, e("tr", {style:{borderBottom:"0.5px solid "+C.borderTertiary}},
        ["Form","Japanese","Romaji","Meaning"].map(h => e("th", {key:h, style:{textAlign:"left", padding:"4px 8px", fontWeight:500, color:C.textSecondary, fontSize:12}}, h))
      )),
      e("tbody", null, result.map((r, i) =>
        e("tr", {key:i, style:{borderBottom:"0.5px solid "+C.borderTertiary}},
          e("td", {style:{padding:"5px 8px", color:C.textSecondary, fontSize:12}}, r.form),
          e("td", {style:{padding:"5px 8px", fontWeight:500}}, r.japanese),
          e("td", {style:{padding:"5px 8px", color:C.textSecondary}}, r.romaji),
          e("td", {style:{padding:"5px 8px", color:C.textSecondary}}, r.meaning)
        )
      ))
    )
  );
}

// ── VocabCard ─────────────────────────────────────────────────────────────────

function VocabCard({word, onToggleFav, onDelete, onUpdateGroups, reorderMode, onMoveUp, onMoveDown, isFirst, isLast, settings, vocabGroups}) {
  const [expanded, setExpanded] = useState(false);
  const [showGroups, setShowGroups] = useState(false);
  const tc = TYPE_COLORS[word.type] || TYPE_COLORS.other;
  const vc = word.verbGroup ? VERB_GROUP_COLORS[word.verbGroup] : null;
  const assigned = (vocabGroups||[]).filter(g => (word.groups||[]).includes(g.id));
  const btn = (label, onClick, active) => e("button", {onClick, style:{fontSize:12, padding:"3px 10px", borderRadius:6, border:"0.5px solid "+C.borderSecondary, background:active?C.bgSecondary:"none", cursor:"pointer", color:C.textSecondary}}, label);
  return e("div", {style:{background:C.bgPrimary}},
    e("div", {style:{padding:"14px 16px", display:"flex", gap:10, alignItems:"flex-start"}},
      reorderMode && e("div", {style:{display:"flex", flexDirection:"column", gap:4, paddingTop:4, flexShrink:0}},
        e(MoveBtn, {dir:"up", disabled:isFirst, onClick:onMoveUp}),
        e(MoveBtn, {dir:"down", disabled:isLast, onClick:onMoveDown})
      ),
      e("div", {style:{flex:1, minWidth:0}},
        e("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:6}},
          e("div", {style:{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}},
            e("span", {style:{fontSize:22, fontWeight:500}}, word.japanese),
            settings.vocab_showHiragana && e("span", {style:{fontSize:14, color:C.textSecondary}}, word.hiragana),
            settings.vocab_showType && e(Badge, {label:word.type, style:{background:tc.bg, color:tc.color, border:"0.5px solid "+tc.border}}),
            word.type==="verb" && vc && e(Badge, {label:"Group "+word.verbGroup, style:{background:vc.bg, color:vc.color, border:"0.5px solid "+vc.border}}),
            assigned.map(g => e(GroupPill, {key:g.id, name:g.name, color:g.color}))
          ),
          e("div", {style:{display:"flex", alignItems:"center", gap:4}},
            e(StarBtn, {active:word.favorite, onClick:()=>onToggleFav(word.id)}),
            btn("⊞", ()=>setShowGroups(s=>!s), showGroups),
            word.type==="verb" && btn(expanded?"hide":"conjugate", ()=>setExpanded(x=>!x), false),
            onDelete && e("button", {onClick:()=>onDelete(word.id), style:{background:"none", border:"none", cursor:"pointer", color:"#B4B2A9", fontSize:16, padding:"2px 4px"}}, "✕")
          )
        ),
        e("div", {style:{marginTop:6}},
          e("span", {style:{fontSize:15}}, word.meaning),
          settings.vocab_showRomaji && e("span", {style:{fontSize:13, color:C.textSecondary, marginLeft:10}}, word.romaji)
        ),
        showGroups && e("div", {style:{marginTop:10, padding:"10px 12px", background:C.bgSecondary, borderRadius:8}},
          e("p", {style:{margin:"0 0 8px", fontSize:12, color:C.textSecondary, fontWeight:500}}, "Assign to groups"),
          e(GroupSelector, {itemGroups:word.groups||[], allGroups:vocabGroups||[], onToggle:gid=>onUpdateGroups(word.id, gid)})
        )
      )
    ),
    expanded && e("div", {style:{borderTop:"1px solid #D3D1C7", padding:"12px 16px"}}, e(ConjugationTable, {word}))
  );
}

// ── GrammarCard ───────────────────────────────────────────────────────────────

function GrammarCard({item, onToggleFav, onDelete, onUpdateNotes, onUpdateGroups, onSaveExamples, reorderMode, onMoveUp, onMoveDown, isFirst, isLast, settings, grammarGroups, showNotes}) {
  const [editingNote, setEditingNote] = useState(false);
  const [noteVal, setNoteVal] = useState(item.notes || "");
  const [examples, setExamples] = useState(Array.isArray(item.examples) ? item.examples : null);
  const [showEx, setShowEx] = useState(false);
  const [loadingEx, setLoadingEx] = useState(false);
  const [exError, setExError] = useState("");
  const [showGroupPicker, setShowGroupPicker] = useState(false);
  const [addingEx, setAddingEx] = useState(false);
  const [newEx, setNewEx] = useState({japanese:"", romaji:"", english:""});
  const lc = LEVEL_COLORS[item.level] || LEVEL_COLORS.N5;
  const assigned = (grammarGroups||[]).filter(g => (item.groups||[]).includes(g.id));
  const saveNote = () => { onUpdateNotes(item.id, noteVal); setEditingNote(false); };
  const persistEx = (updated) => { setExamples(updated); if (onSaveExamples) onSaveExamples(item.id, updated); };
  const inp = {width:"100%", boxSizing:"border-box", padding:"7px 10px", borderRadius:7, border:"0.5px solid "+C.borderSecondary, background:C.bgPrimary, fontSize:13, color:C.textPrimary};
  const handleAIExamples = async () => {
    if (showEx) { setShowEx(false); return; }
    if (examples) { setShowEx(true); return; }
    setLoadingEx(true); setExError("");
    try {
      const prompt = "Give me 3 simple example sentences using the Japanese grammar pattern "+item.pattern+" which means "+item.meaning+". Return ONLY a raw JSON array, no markdown, no fences. Each element has keys: japanese furigana romaji english highlight_jp highlight_ro. furigana is an array of objects with keys kanji and reading where reading is null for kana-only. highlight_jp and highlight_ro are the exact grammar pattern substrings. Keep sentences very short.";
      const text = await callAPI(prompt, 1000);
      const loaded = extractJSON(text);
      setExamples(loaded); setShowEx(true);
      if (onSaveExamples) onSaveExamples(item.id, loaded);
    } catch(err) { setExError(err.message); setExamples("error"); }
    setLoadingEx(false);
  };
  const addManualEx = () => {
    if (!newEx.japanese.trim()) return;
    const ex = {japanese:newEx.japanese, romaji:newEx.romaji, english:newEx.english, furigana:null, highlight_jp:null, highlight_ro:null};
    const updated = Array.isArray(examples) ? [...examples, ex] : [ex];
    persistEx(updated); setShowEx(true); setAddingEx(false); setNewEx({japanese:"", romaji:"", english:""});
  };
  const deleteEx = (i) => { const u = examples.filter((_, idx) => idx !== i); persistEx(u.length === 0 ? null : u); };

  return e("div", {style:{background:C.bgPrimary}},
    e("div", {style:{padding:"14px 16px", display:"flex", gap:10, alignItems:"flex-start"}},
      reorderMode && e("div", {style:{display:"flex", flexDirection:"column", gap:4, paddingTop:4, flexShrink:0}},
        e(MoveBtn, {dir:"up", disabled:isFirst, onClick:onMoveUp}),
        e(MoveBtn, {dir:"down", disabled:isLast, onClick:onMoveDown})
      ),
      e("div", {style:{flex:1, minWidth:0}},
        e("div", {style:{display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:8}},
          e("div", {style:{flex:1}},
            e("div", {style:{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}},
              e("span", {style:{fontSize:20, fontWeight:500}}, item.pattern),
              settings.grammar_showRomaji && e("span", {style:{fontSize:14, color:C.textSecondary}}, item.romaji),
              settings.grammar_showLevel && e(Badge, {label:item.level, style:{background:lc.bg, color:lc.color}}),
              assigned.map(g => e(GroupPill, {key:g.id, name:g.name, color:g.color}))
            ),
            e("p", {style:{margin:"6px 0 4px", fontSize:15}}, item.meaning),
            settings.grammar_showExample && e("p", {style:{margin:0, fontSize:13, color:C.textSecondary, fontStyle:"italic"}}, item.example)
          ),
          e("div", {style:{display:"flex", alignItems:"center", gap:4, flexShrink:0}},
            e(StarBtn, {active:item.favorite, onClick:()=>onToggleFav(item.id)}),
            e("button", {onClick:()=>setShowGroupPicker(s=>!s), style:{fontSize:12, padding:"3px 10px", borderRadius:6, border:"0.5px solid "+C.borderSecondary, background:showGroupPicker?C.bgSecondary:"none", cursor:"pointer", color:C.textSecondary}}, "⊞"),
            e("button", {onClick:handleAIExamples, disabled:loadingEx, style:{fontSize:12, padding:"3px 10px", borderRadius:6, border:"0.5px solid "+C.borderSecondary, background:showEx?C.bgSecondary:"none", cursor:loadingEx?"default":"pointer", color:C.textSecondary, whiteSpace:"nowrap"}},
              loadingEx ? "Loading…" : showEx ? "hide" : Array.isArray(examples) ? "examples ✓" : "examples ↗"
            ),
            onDelete && e("button", {onClick:()=>onDelete(item.id), style:{background:"none", border:"none", cursor:"pointer", color:"#B4B2A9", fontSize:16, padding:"2px 4px"}}, "✕")
          )
        ),
        showGroupPicker && e("div", {style:{marginTop:10, padding:"10px 12px", background:C.bgSecondary, borderRadius:8}},
          e("p", {style:{margin:"0 0 8px", fontSize:12, color:C.textSecondary, fontWeight:500}}, "Assign to groups"),
          e(GroupSelector, {itemGroups:item.groups||[], allGroups:grammarGroups||[], onToggle:gid=>onUpdateGroups(item.id, gid)})
        ),

function StudyTab({vocab, vocabGroups}) {
  const [phase, setPhase] = useState("setup");
  const [groupFilter, setGroupFilter] = useState("all");
  const [sourceFilter, setSourceFilter] = useState("all");
  const [direction, setDirection] = useState("jp-en");
  const [deck, setDeck] = useState([]);
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [got, setGot] = useState([]);
  const [retry, setRetry] = useState([]);
  const [isRetryRound, setIsRetryRound] = useState(false);
  const sel = {padding:"8px 10px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, fontSize:14, color:C.textPrimary, width:"100%"};
  const lbl = {fontSize:13, color:C.textSecondary, marginBottom:6, display:"block"};
  const buildDeck = () => {
    let pool = [...vocab];
    if (sourceFilter === "favorites") pool = pool.filter(w => w.favorite);
    if (groupFilter !== "all") pool = pool.filter(w => (w.groups||[]).includes(Number(groupFilter)));
    const s = pool.sort(() => Math.random() - 0.5);
    setDeck(s); setIndex(0); setFlipped(false); setGot([]); setRetry([]); setIsRetryRound(false);
    setPhase(s.length === 0 ? "empty" : "study");
  };
  const advance = (ng, nr, cd, ci) => {
    if (ci+1 < cd.length) { setIndex(ci+1); setFlipped(false); }
    else if (nr.length > 0) { setDeck([...nr].sort(()=>Math.random()-0.5)); setRetry([]); setIndex(0); setFlipped(false); setIsRetryRound(true); }
    else { setGot(ng); setPhase("results"); }
  };
  const handleGot = () => { const ng = [...got, deck[index]]; setGot(ng); advance(ng, retry, deck, index); };
  const handleRetry = () => { const nr = [...retry, deck[index]]; setRetry(nr); advance(got, nr, deck, index); };
  if (phase === "setup") return e("div", null,
    e("p", {style:{fontSize:15, color:C.textSecondary, marginTop:0, marginBottom:24}}, "Configure your flashcard session."),
    e("div", {style:{display:"flex", flexDirection:"column", gap:16, maxWidth:400}},
      e("div", null, e("label", {style:lbl}, "Card set"), e("select", {style:sel, value:sourceFilter, onChange:ev=>setSourceFilter(ev.target.value)}, e("option", {value:"all"}, "All vocabulary"), e("option", {value:"favorites"}, "Favorites only"))),
      e("div", null, e("label", {style:lbl}, "Group"), e("select", {style:sel, value:groupFilter, onChange:ev=>setGroupFilter(ev.target.value)}, e("option", {value:"all"}, "All groups"), vocabGroups.map(g => e("option", {key:g.id, value:g.id}, g.name)))),
      e("div", null, e("label", {style:lbl}, "Direction"), e("select", {style:sel, value:direction, onChange:ev=>setDirection(ev.target.value)}, e("option", {value:"jp-en"}, "Japanese to English"), e("option", {value:"en-jp"}, "English to Japanese"))),
      e("button", {onClick:buildDeck, style:{padding:"12px", borderRadius:10, border:"none", background:C.green, cursor:"pointer", fontWeight:500, fontSize:15, color:"#fff", marginTop:8}}, "Start studying")
    )
  );
  if (phase === "empty") return e("div", {style:{textAlign:"center", paddingTop:40}},
    e("p", {style:{fontSize:15, color:C.textSecondary}}, "No vocabulary found."),
    e("button", {onClick:()=>setPhase("setup"), style:{marginTop:12, padding:"8px 20px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:"none", cursor:"pointer", fontSize:14, color:C.textPrimary}}, "Back")
  );
  if (phase === "results") return e("div", {style:{textAlign:"center", paddingTop:20}},
    e("div", {style:{fontSize:48, marginBottom:12}}, "🎉"),
    e("h2", {style:{fontSize:22, fontWeight:500, margin:"0 0 8px"}}, "Session complete!"),
    e("p", {style:{fontSize:15, color:C.textSecondary, margin:"0 0 28px"}}, "You got through all ", e("strong", null, got.length), " cards!"),
    e("div", {style:{display:"flex", gap:12, justifyContent:"center", flexWrap:"wrap"}},
      e("button", {onClick:buildDeck, style:{padding:"10px 22px", borderRadius:8, border:"none", background:C.green, cursor:"pointer", fontWeight:500, fontSize:14, color:"#fff"}}, "Study again"),
      e("button", {onClick:()=>setPhase("setup"), style:{padding:"10px 22px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:"none", cursor:"pointer", fontSize:14, color:C.textPrimary}}, "Change settings")
    )
  );
  const card = deck[index];
  const tc = card ? (TYPE_COLORS[card.type] || TYPE_COLORS.other) : null;
  const vc = card && card.verbGroup ? VERB_GROUP_COLORS[card.verbGroup] : null;
  const progress = deck.length > 0 ? (index / deck.length) * 100 : 0;
  return e("div", null,
    e("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16}},
      e("button", {onClick:()=>setPhase("setup"), style:{background:"none", border:"none", cursor:"pointer", fontSize:13, color:C.textSecondary, padding:0}}, "Back"),
      e("span", {style:{fontSize:13, color:C.textSecondary}},
        isRetryRound && e("span", {style:{color:"#D85A30", fontWeight:500, marginRight:6}}, "Retry round"),
        (index+1)+" / "+deck.length
      ),
      e("span", {style:{fontSize:13, color:C.green, fontWeight:500}}, "Correct: "+got.length)
    ),
    e("div", {style:{height:4, background:C.bgSecondary, borderRadius:2, marginBottom:24, overflow:"hidden"}},
      e("div", {style:{height:"100%", width:progress+"%", background:C.green, borderRadius:2, transition:"width 0.3s"}})
    ),
    e("div", {onClick:()=>setFlipped(f=>!f), style:{cursor:"pointer", background:C.bgPrimary, border:"0.5px solid "+C.borderTertiary, borderRadius:16, minHeight:220, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"32px 24px", marginBottom:20, textAlign:"center", userSelect:"none"}},
      !flipped
        ? e("div", null,
            direction === "jp-en"
              ? e("div", null, e("p", {style:{fontSize:42, fontWeight:500, margin:"0 0 8px"}}, card.japanese), e("p", {style:{fontSize:16, color:C.textSecondary, margin:0}}, card.hiragana))
              : e("p", {style:{fontSize:26, fontWeight:500, margin:0}}, card.meaning),
            e("p", {style:{fontSize:12, color:"#B4B2A9", marginTop:24, marginBottom:0}}, "Tap to reveal")
          )
        : e("div", {style:{width:"100%"}},
            direction === "jp-en"
              ? e("div", null, e("p", {style:{fontSize:28, fontWeight:500, margin:"0 0 6px"}}, card.meaning), e("p", {style:{fontSize:14, color:C.textSecondary, margin:"0 0 12px"}}, card.romaji))
              : e("div", null, e("p", {style:{fontSize:42, fontWeight:500, margin:"0 0 8px"}}, card.japanese), e("p", {style:{fontSize:16, color:C.textSecondary, margin:"0 0 4px"}}, card.hiragana), e("p", {style:{fontSize:14, color:C.textSecondary, margin:"0 0 12px"}}, card.romaji)),
            e("div", {style:{display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap", marginTop:8}},
              tc && e(Badge, {label:card.type, style:{background:tc.bg, color:tc.color, border:"0.5px solid "+tc.border}}),
              vc && e(Badge, {label:"Group "+card.verbGroup, style:{background:vc.bg, color:vc.color, border:"0.5px solid "+vc.border}})
            )
          )
    ),
    flipped && e("div", {style:{display:"flex", gap:12}},
      e("button", {onClick:handleRetry, style:{flex:1, padding:"14px", borderRadius:10, border:"0.5px solid "+C.red, background:"#FDF0F0", cursor:"pointer", fontWeight:500, fontSize:15, color:C.red}}, "Try again"),
      e("button", {onClick:handleGot, style:{flex:1, padding:"14px", borderRadius:10, border:"none", background:C.green, cursor:"pointer", fontWeight:500, fontSize:15, color:"#fff"}}, "Got it")
    )
  );
}

function FixVerbGroupsBtn({vocab, onUpdate}) {
  const [status, setStatus] = useState("");
  const [loading, setLoading] = useState(false);
  const fix = async () => {
    setLoading(true); setStatus("");
    const verbs = vocab.filter(w=>w.type==="verb"&&!w.verbGroup);
    if (!verbs.length) { setStatus("All verbs have a group!"); setLoading(false); return; }
    try {
      const p = "For each verb return ONLY a JSON array of objects with keys japanese and verbGroup where 1 is Godan 2 is Ichidan and 3 is Irregular. Verbs: "+verbs.map(v=>v.japanese).join(", ")+". No markdown.";
      const t = await callAPI(p, 500);
      const r = extractJSON(t);
      const m = {}; r.forEach(x=>{m[x.japanese]=x.verbGroup;});
      onUpdate(vocab.map(w=>w.type==="verb"?{...w,verbGroup:m[w.japanese]??w.verbGroup??null}:w));
      setStatus("Updated "+r.length+" verb(s)!");
    } catch(err) { setStatus("Failed: "+err.message); }
    setLoading(false);

  return e("div", null,

function ExportImportSection({vocab, grammar, vocabGroups, grammarGroups, settings, onImport}) {
  const [importMsg, setImportMsg] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const fileRef = useRef(null);
  const handleExport = () => {
    const payload = {version:1, exportedAt:new Date().toISOString(), vocab, grammar, vocabGroups, grammarGroups, settings};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "japanese_study_backup_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const handleFileChange = (ev) => {
    const file = ev.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (re) => {
      try {
        const data = JSON.parse(re.target.result);
        if (!data.vocab||!Array.isArray(data.vocab)) throw new Error("Missing vocab array");
        if (!data.grammar||!Array.isArray(data.grammar)) throw new Error("Missing grammar array");
        onImport({vocab:data.vocab, grammar:data.grammar, vocabGroups:Array.isArray(data.vocabGroups)?data.vocabGroups:[], grammarGroups:Array.isArray(data.grammarGroups)?data.grammarGroups:[], settings:data.settings&&typeof data.settings==="object"?data.settings:null});
        setImportMsg("Imported "+data.vocab.length+" words and "+data.grammar.length+" grammar patterns successfully.");
        setImportStatus("ok");
      } catch(err) { setImportMsg("Import failed: "+err.message); setImportStatus("error"); }
      ev.target.value = ""; setTimeout(()=>{setImportMsg("");setImportStatus("");}, 5000);
    };
    reader.readAsText(file);
  };
  const btnStyle = {padding:"8px 16px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, cursor:"pointer", fontSize:13, fontWeight:500, color:C.textPrimary};
  return e("div", null,
    e("div", {style:{padding:"14px 0", borderBottom:"1px solid #D3D1C7"}},
      e("p", {style:{margin:"0 0 4px", fontSize:14, color:C.textPrimary}}, "Export data"),
      e("p", {style:{margin:"0 0 10px", fontSize:12, color:C.textSecondary}}, "Download all vocabulary ("+vocab.length+" words), grammar ("+grammar.length+" patterns), groups and settings as a JSON file."),
      e("button", {onClick:handleExport, style:btnStyle}, "Download backup .json")
    ),
    e("div", {style:{padding:"14px 0", borderBottom:"1px solid #D3D1C7"}},
      e("p", {style:{margin:"0 0 4px", fontSize:14, color:C.textPrimary}}, "Import data"),
      e("p", {style:{margin:"0 0 10px", fontSize:12, color:C.textSecondary}}, "Load a previously exported JSON file. This will replace all current data."),
      e("input", {ref:fileRef, type:"file", accept:".json,application/json", onChange:handleFileChange, style:{display:"none"}}),
      e("button", {onClick:()=>fileRef.current?.click(), style:btnStyle}, "Choose file to import…"),
      importMsg && e("p", {style:{marginTop:8, fontSize:13, color:importStatus==="ok"?"#3B6D11":"#A32D2D"}}, (importStatus==="ok"?"✓ ":"✕ ")+importMsg)
    )
  );
}

function App() {
  const [tab, setTab] = useState("vocab");
  const [vocab, setVocab] = useState(() => { const s = loadLS("jp_vocab4", MNN_VOCAB); return s.map(w=>({verbGroup:null,groups:[],...w})); });
  const [grammar, setGrammar] = useState(() => { const s = loadLS("jp_grammar4", DEFAULT_GRAMMAR); return s.map(g=>({groups:[],notes:"",examples:null,...g,examples:Array.isArray(g.examples)?g.examples:null})); });
  const [settings, setSettings] = useState(() => ({...DEFAULT_SETTINGS,...loadLS("jp_settings4",{})}));
  const [vocabGroups, setVocabGroups] = useState(() => loadLS("jp_vocabGroups4", []));
  const [grammarGroups, setGrammarGroups] = useState(() => loadLS("jp_grammarGroups4", []));
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("all");
  const [filterGroup, setFilterGroup] = useState("all");
  const [reorderMode, setReorderMode] = useState(false);
  const [showNotes, setShowNotes] = useState(false);

  const savV = v => { setVocab(v); saveLS("jp_vocab4",v); };
  const savG = g => { setGrammar(g); saveLS("jp_grammar4",g); };
  const savVG = vg => { setVocabGroups(vg); saveLS("jp_vocabGroups4",vg); };
  const savGG = gg => { setGrammarGroups(gg); saveLS("jp_grammarGroups4",gg); };
  const updS = (k,v) => { const n={...settings,[k]:v}; setSettings(n); saveLS("jp_settings4",n); };

  const addVG = g => savVG([...vocabGroups,g]);
  const delVG = id => { savVG(vocabGroups.filter(g=>g.id!==id)); savV(vocab.map(w=>({...w,groups:(w.groups||[]).filter(gid=>gid!==id)}))); };
  const addGG = g => savGG([...grammarGroups,g]);
  const delGG = id => { savGG(grammarGroups.filter(g=>g.id!==id)); savG(grammar.map(g=>({...g,groups:(g.groups||[]).filter(gid=>gid!==id)}))); };

  const togVF = id => savV(vocab.map(w=>w.id===id?{...w,favorite:!w.favorite}:w));
  const togGF = id => savG(grammar.map(g=>g.id===id?{...g,favorite:!g.favorite}:g));
  const delV = id => savV(vocab.filter(w=>w.id!==id));
  const delG = id => savG(grammar.filter(g=>g.id!==id));
  const addV = w => savV([...vocab,w]);
  const addG = g => savG([...grammar,g]);
  const updN = (id,notes) => savG(grammar.map(g=>g.id===id?{...g,notes}:g));
  const saveEx = (id,examples) => savG(grammar.map(g=>g.id===id?{...g,examples}:g));
  const updVG = (id,gid) => savV(vocab.map(w=>w.id===id?{...w,groups:(w.groups||[]).includes(gid)?w.groups.filter(x=>x!==gid):[...(w.groups||[]),gid]}:w));
  const updGG = (id,gid) => savG(grammar.map(g=>g.id===id?{...g,groups:(g.groups||[]).includes(gid)?g.groups.filter(x=>x!==gid):[...(g.groups||[]),gid]}:g));
  const mvV = (id,dir) => savV(swapItems(vocab,id,dir));
  const mvG = (id,dir) => savG(swapItems(grammar,id,dir));

  const handleReset = () => {
    const lg = buildLessonGroups();
    savV(assignLessonGroups(MNN_VOCAB, lg));
    savG(DEFAULT_GRAMMAR.map(g=>({groups:[],notes:"",examples:null,...g})));
    savVG(lg); savGG([]);
    const ns={...DEFAULT_SETTINGS}; setSettings(ns); saveLS("jp_settings4",ns);
  };
  const handleImport = ({vocab:iv,grammar:ig,vocabGroups:ivg,grammarGroups:igg,settings:is}) => {
    savV(iv.map(w=>({verbGroup:null,groups:[],...w})));
    savG(ig.map(g=>({groups:[],notes:"",examples:null,...g,examples:Array.isArray(g.examples)?g.examples:null})));
    savVG(ivg); savGG(igg);
    if (is) { const ns={...DEFAULT_SETTINGS,...is}; setSettings(ns); saveLS("jp_settings4",ns); }
  };

  const q = search.toLowerCase();
  const ag = tab==="vocab" ? vocabGroups : grammarGroups;
  const dv = reorderMode ? vocab : vocab.filter(w =>
    (!q||w.japanese.includes(q)||w.romaji.toLowerCase().includes(q)||w.meaning.toLowerCase().includes(q)||w.hiragana.includes(q))&&
    (filterType==="all"||w.type===filterType)&&
    (filterGroup==="all"||(w.groups||[]).includes(Number(filterGroup)))
  );
  const dg = reorderMode ? grammar : grammar.filter(g =>
    (!q||g.pattern.includes(q)||g.romaji.toLowerCase().includes(q)||g.meaning.toLowerCase().includes(q))&&
    (filterGroup==="all"||(g.groups||[]).includes(Number(filterGroup)))
  );

  const TABS = ["vocab","grammar","study","quickstudy","favorites","add","settings"];
  const LABELS = {vocab:"Vocabulary",grammar:"Grammar",study:"Study",quickstudy:"Quick Study",favorites:"Favorites",add:"+ Add",settings:"Settings"};

  const renderGC = (g, i, arr, reorder=false) => e("div", {key:g.id},
    i>0 && e("hr", {style:{border:"none", borderTop:"1px solid #D3D1C7", margin:0}}),
    e(GrammarCard, {item:g, onToggleFav:togGF, onDelete:delG, onUpdateNotes:updN, onUpdateGroups:updGG, onSaveExamples:saveEx, settings, grammarGroups, showNotes, reorderMode:reorder, onMoveUp:reorder?()=>mvG(g.id,-1):undefined, onMoveDown:reorder?()=>mvG(g.id,1):undefined, isFirst:i===0, isLast:i===arr.length-1})
  );

  return e("div", {style:{padding:"1.5rem 1rem", maxWidth:700, margin:"0 auto"}},
    e("div", {style:{display:"flex", alignItems:"baseline", gap:10, marginBottom:20}},
      e("span", {style:{fontSize:22, fontWeight:500}}, "日本語"),
      e("span", {style:{fontSize:15, color:C.textSecondary}}, "Japanese Study App")
    ),
    e("div", {style:{display:"flex", gap:6, marginBottom:20, flexWrap:"wrap"}},
      TABS.map(t => e("button", {key:t, onClick:()=>{setTab(t);setReorderMode(false);setFilterGroup("all");}, style:{padding:"7px 14px", borderRadius:8, border:"0.5px solid "+(tab===t?C.borderPrimary:C.borderTertiary), background:tab===t?C.bgSecondary:"none", cursor:"pointer", fontWeight:tab===t?500:400, color:C.textPrimary, fontSize:13}}, LABELS[t]))
    ),

    (tab==="vocab"||tab==="grammar") && e("div", {style:{display:"flex", gap:8, marginBottom:16, alignItems:"center", flexWrap:"wrap"}},
      !reorderMode && e(React.Fragment, null,
        e("input", {value:search, onChange:ev=>setSearch(ev.target.value), placeholder:"Search...", style:{flex:1, minWidth:120, padding:"8px 12px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, fontSize:14, color:C.textPrimary}}),
        tab==="vocab" && e("select", {value:filterType, onChange:ev=>setFilterType(ev.target.value), style:{padding:"8px 10px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, fontSize:13, color:C.textPrimary}},
          e("option",{value:"all"},"All types"),
          ["verb","noun","adjective","adverb","other"].map(t=>e("option",{key:t,value:t},t))
        ),
        ag.length>0 && e("select", {value:filterGroup, onChange:ev=>setFilterGroup(ev.target.value), style:{padding:"8px 10px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:C.bgSecondary, fontSize:13, color:C.textPrimary}},
          e("option",{value:"all"},"All groups"),
          ag.map(g=>e("option",{key:g.id,value:g.id},g.name))
        )
      ),
      e("button", {onClick:()=>{setReorderMode(r=>!r);setSearch("");setFilterGroup("all");}, style:{padding:"8px 14px", borderRadius:8, border:"0.5px solid "+(reorderMode?C.borderPrimary:C.borderSecondary), background:reorderMode?C.bgSecondary:"none", cursor:"pointer", fontSize:13, fontWeight:reorderMode?500:400, color:C.textPrimary, whiteSpace:"nowrap"}}, reorderMode?"Done":"Reorder")
    ),

    reorderMode && e("p", {style:{fontSize:13, color:C.textSecondary, marginBottom:14, marginTop:-4}}, "Use arrows to reorder. Click Done when finished."),

    tab==="vocab" && e("div", null,
      dv.length===0 && e("p", {style:{color:C.textSecondary, fontSize:14}}, "No words found."),
      dv.map((w,i) => e("div", {key:w.id},
        i>0 && e("hr", {style:{border:"none", borderTop:"1px solid #D3D1C7", margin:0}}),
        e(VocabCard, {word:w, onToggleFav:togVF, onDelete:delV, onUpdateGroups:updVG, settings, vocabGroups, reorderMode, onMoveUp:()=>mvV(w.id,-1), onMoveDown:()=>mvV(w.id,1), isFirst:i===0, isLast:i===dv.length-1})
      ))
    ),

    tab==="grammar" && e("div", null,
      e("div", {style:{display:"flex", justifyContent:"flex-end", marginBottom:12}},
        e("button", {onClick:()=>setShowNotes(s=>!s), style:{fontSize:13, padding:"5px 14px", borderRadius:8, border:"0.5px solid "+C.borderSecondary, background:showNotes?C.bgSecondary:"none", cursor:"pointer", color:C.textSecondary}}, showNotes?"Hide notes":"Show notes")
      ),
      dg.length===0 && e("p", {style:{color:C.textSecondary, fontSize:14}}, "No grammar patterns found."),
      dg.map((g,i,arr) => renderGC(g,i,arr,reorderMode))
    ),

    tab==="study" && e(StudyTab, {vocab, vocabGroups}),
    tab==="quickstudy" && e(QuickStudyTab),

    tab==="favorites" && e("div", null,
      vocab.filter(w=>w.favorite).length===0 && grammar.filter(g=>g.favorite).length===0 && e("p", {style:{color:C.textSecondary, fontSize:14}}, "No favorites yet."),
      vocab.filter(w=>w.favorite).length>0 && e(React.Fragment, null,
        e("p", {style:{fontSize:13, fontWeight:500, color:C.textSecondary, marginBottom:10, marginTop:0}}, "Vocabulary"),
        vocab.filter(w=>w.favorite).map((w,i,arr) => e("div", {key:w.id},
          i>0 && e("hr", {style:{border:"none", borderTop:"1px solid #D3D1C7", margin:0}}),
          e(VocabCard, {word:w, onToggleFav:togVF, onDelete:delV, onUpdateGroups:updVG, settings, vocabGroups})
        ))
      ),
      grammar.filter(g=>g.favorite).length>0 && e(React.Fragment, null,
        e("p", {style:{fontSize:13, fontWeight:500, color:C.textSecondary, marginBottom:10, marginTop:vocab.filter(w=>w.favorite).length>0?20:0}}, "Grammar"),
        grammar.filter(g=>g.favorite).map((g,i,arr) => renderGC(g,i,arr))
      )
    ),

    tab==="add" && e(AddForm, {onAddVocab:addV, onAddGrammar:addG, vocabGroups, grammarGroups}),

    tab==="settings" && e(SettingsTab, {
      settings, onChangeSetting:updS,
      vocabGroups, grammarGroups,
      onAddVocabGroup:addVG, onDeleteVocabGroup:delVG,
      onAddGrammarGroup:addGG, onDeleteGrammarGroup:delGG,
      vocab, grammar,
      onUpdateVocab:savV, onUpdateVocabGroups:savVG,
      onReset:handleReset, onImport:handleImport
    })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
